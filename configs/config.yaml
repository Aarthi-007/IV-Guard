# IVGuard Global Configuration

camera:
  camera_source: "local"
  camera_index: 0
  stream_url: ""
  timeout: 10

model:
  path: "models/trained/ivguard_yolo26n_best.pt"
  tracker_config: "bytetrack.yaml"
  conf_threshold: 0.25
  iou_threshold: 0.50
  imgsz: 480

displacement:
  init_frames: 30
  threshold_px: 15.0
  consecutive_frames: 10
  smoothing_window: 5
  grace_period_frames: 20

alert:
  cooldown_seconds: 3.0

server:
  host: "0.0.0.0"
  port: 8000
